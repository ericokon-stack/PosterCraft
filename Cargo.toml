[package]
name = "postercraft"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "=0.29.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
